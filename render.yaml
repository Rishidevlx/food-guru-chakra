services:
  - type: web
    name: food-guru-chakra
    env: docker
    plan: free
    dockerfilePath: Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_NAME
        value: "FOOD GURU CHAKRA"
      - key: LOG_CHANNEL
        value: stderr
      - key: APP_KEY
        generateValue: true
